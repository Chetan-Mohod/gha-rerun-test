name: Single Job Minimal Rerun

on:
  push:
  workflow_dispatch:

jobs:
  main-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check last success
        id: check
        run: |
          LAST=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id')
          if [[ $LAST != "null" && ${{ github.run_attempt }} -gt 1 ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT

      - name: Validation
        run: echo "Step 1 - always runs"

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: echo "Step 2 - Build"

      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        run: echo "Step 3 - Deploy"
