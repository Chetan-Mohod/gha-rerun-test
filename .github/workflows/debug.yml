name: Docker Hub Test

on:
  workflow_dispatch:

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Secrets Exist
        run: |
          echo "Username exists: ${{ secrets.DOCKER_USERNAME != '' }}"
          echo "Password exists: ${{ secrets.DOCKER_PASSWORD != '' }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Login
        run: |
          docker info

      - name: Pull Test Image
        run: |
          docker pull nginx:latest

      - name: Tag Image
        run: |
          docker tag nginx:latest ${{ secrets.DOCKER_USERNAME }}/test:latest

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/test:latest
