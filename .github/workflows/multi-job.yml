name: Multi-Job Minimal Rerun

on:
  workflow_dispatch:

jobs:

  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          LAST=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id')

          if [[ "$LAST" != "null" && ${{ github.run_attempt }} -gt 1 ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT

  job1:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: echo "Job1 - Validation"

  job2:
    runs-on: ubuntu-latest
    needs: job1
    if: needs.check.outputs.skip != 'true'
    steps:
      - run: echo "Job2 - Build"

  job3:
    runs-on: ubuntu-latest
    needs: job2
    if: needs.check.outputs.skip != 'true'
    steps:
      - run: echo "Job3 - Deploy"
