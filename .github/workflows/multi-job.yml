name: Multi-Job Rerun Test

on:
  push:
  workflow_dispatch:

jobs:

  check-baseline:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.logic.outputs.should_skip }}
    steps:
      - name: Check last successful run
        id: logic
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=success&per_page=1")

          LAST_SUCCESS_RUN_ID=$(echo "$RESPONSE" | jq -r '.workflow_runs[0].id')
          CURRENT_RUN_ID=${{ github.run_id }}
          RUN_ATTEMPT=${{ github.run_attempt }}

          if [[ "$RUN_ATTEMPT" -gt 1 && "$LAST_SUCCESS_RUN_ID" != "null" ]]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT

  job1:
    runs-on: ubuntu-latest
    needs: check-baseline
    steps:
      - name: Step 1 - Checkout
        uses: actions/checkout@v4
      - name: Step 2 - Validation
        run: echo "Running validation step"

  job2:
    runs-on: ubuntu-latest
    needs: job1
    if: needs.check-baseline.outputs.should_skip != 'true'
    steps:
      - name: Step 3 - Build
        run: echo "Building application..."

  job3:
    runs-on: ubuntu-latest
    needs: job2
    if: needs.check-baseline.outputs.should_skip != 'true'
    steps:
      - name: Step 4 - Deploy
        run: echo "Deploying application..."
