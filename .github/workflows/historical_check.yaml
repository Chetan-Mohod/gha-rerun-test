name: History-Aware-Demo

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:

  history-check:
    runs-on: ubuntu-latest

    outputs:
      success_flag: ${{ steps.check.outputs.flag }}

    steps:
      - name: Check previous runs
        id: check
        run: |

          echo "Checking workflow history..."

          # Get workflow runs
          runs=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=50")

          total_runs=$(echo "$runs" | jq '.total_count')

          echo "Total runs: $total_runs"

          # FIRST RUN CHECK
          if [ "$total_runs" -le 1 ]; then

            echo "First run detected"

            echo "flag=true" >> $GITHUB_OUTPUT

            exit 0
          fi

          flag=false

          # Loop previous runs
          for run_id in $(echo "$runs" | jq -r '.workflow_runs[].id'); do

            # Skip current run
            if [ "$run_id" == "${{ github.run_id }}" ]; then
              continue
            fi

            echo "Checking Run ID: $run_id"

            jobs=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id/jobs")

            jobA=$(echo "$jobs" | jq -r '.jobs[] | select(.name=="JOB A") | .conclusion')

            jobB=$(echo "$jobs" | jq -r '.jobs[] | select(.name=="JOB B") | .conclusion')

            echo "JOB A = $jobA"
            echo "JOB B = $jobB"

            if [[ "$jobA" == "success" && "$jobB" == "success" ]]; then

              echo "Historical success found"

              flag=true

              break
            fi
          done

          echo "Final Flag = $flag"

          echo "flag=$flag" >> $GITHUB_OUTPUT

  jobA:
    name: JOB A

    runs-on: ubuntu-latest

    needs:
      - history-check

    # IMPORTANT CONDITION
    if: needs.history-check.outputs.success_flag == 'true'

    steps:
      - run: |
          echo "Running JOB A"

  jobB:
    name: JOB B

    runs-on: ubuntu-latest

    needs:
      - history-check

    # IMPORTANT CONDITION
    if: needs.history-check.outputs.success_flag == 'true'

    steps:
      - run: |
          echo "Running JOB B"

  final-job:
    name: FINAL JOB

    runs-on: ubuntu-latest

    needs:
      - history-check
      - jobA
      - jobB

    steps:
      - run: |
          echo "History Flag = ${{ needs.history-check.outputs.success_flag }}"
