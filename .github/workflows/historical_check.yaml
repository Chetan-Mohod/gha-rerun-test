name: Rerun-Aware-Demo

on:
  workflow_dispatch:

jobs:

  history-check:
    name: HISTORY CHECK

    runs-on: ubuntu-latest

    outputs:
      run_jobB: ${{ steps.check.outputs.run_jobB }}

    steps:

      - name: Check rerun attempt
        id: check
        run: |

          echo "Run Attempt: ${{ github.run_attempt }}"

          # FIRST EXECUTION
          if [ "${{ github.run_attempt }}" -eq 1 ]; then

            echo "First workflow execution"

            echo "run_jobB=true" >> $GITHUB_OUTPUT

          else

            echo "This is a rerun"

            echo "run_jobB=false" >> $GITHUB_OUTPUT
          fi

  jobA:
    name: JOB A

    runs-on: ubuntu-latest

    needs:
      - history-check

    # ALWAYS RUN
    steps:
      - run: |
          echo "Running JOB A"

  jobB:
    name: JOB B

    runs-on: ubuntu-latest

    needs:
      - history-check

    # RUN ONLY ON FIRST EXECUTION
    if: needs.history-check.outputs.run_jobB == 'true'

    steps:
      - run: |
          echo "Running JOB B"

  final-job:
    name: FINAL JOB

    runs-on: ubuntu-latest

    needs:
      - history-check
      - jobA
      - jobB

    if: always()

    steps:
      - run: |

          echo "================================="
          echo "Run Attempt : ${{ github.run_attempt }}"
          echo "JOB A RESULT: ${{ needs.jobA.result }}"
          echo "JOB B RESULT: ${{ needs.jobB.result }}"
          echo "================================="
