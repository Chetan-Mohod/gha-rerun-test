name: Checkpoint-Demo

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:

  history-check:
    name: HISTORY CHECK

    runs-on: ubuntu-latest

    outputs:
      run_jobA: ${{ steps.check.outputs.run_jobA }}
      run_jobB: ${{ steps.check.outputs.run_jobB }}

    steps:

      - name: Check Previous Workflow Jobs
        id: check
        run: |
          echo "Checking workflow history..."
          WORKFLOW_NAME="${{ github.workflow }}"
          # Get ONLY this workflow runs
          runs=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows")
          workflow_id=$(echo "$runs" | jq -r \
            '.workflows[] | select(.name=="'"$WORKFLOW_NAME"'") | .id')
          echo "Workflow ID: $workflow_id"
          workflow_runs=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$workflow_id/runs?per_page=10")
          total_runs=$(echo "$workflow_runs" | jq '.workflow_runs | length')
          echo "Total Workflow Runs: $total_runs"
          # Default = run jobs
          run_jobA=true
          run_jobB=true
          # FIRST RUN
          if [ "$total_runs" -le 1 ]; then
            echo "First run detected"
            echo "run_jobA=true" >> $GITHUB_OUTPUT
            echo "run_jobB=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Get PREVIOUS RUN only
          previous_run_id=$(echo "$workflow_runs" | jq -r \
            ".workflow_runs[] | select(.id != ${{ github.run_id }}) | .id" | head -n 1)
          echo "Previous Run ID: $previous_run_id"
          jobs=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$previous_run_id/jobs")
          jobA_status=$(echo "$jobs" | jq -r \
            '.jobs[] | select(.name=="JOB A") | .conclusion')
          jobB_status=$(echo "$jobs" | jq -r \
            '.jobs[] | select(.name=="JOB B") | .conclusion')
          echo "JOB A Previous Status: $jobA_status"
          echo "JOB B Previous Status: $jobB_status"
          # SKIP already successful jobs
          if [[ "$jobA_status" == "success" ]]; then
            run_jobA=false
          fi
          if [[ "$jobB_status" == "success" ]]; then
            run_jobB=false
          fi
          echo ""
          echo "Final Decisions"
          echo "Run JOB A: $run_jobA"
          echo "Run JOB B: $run_jobB"
          echo "run_jobA=$run_jobA" >> $GITHUB_OUTPUT
          echo "run_jobB=$run_jobB" >> $GITHUB_OUTPUT
  jobA:
    name: JOB A

    runs-on: ubuntu-latest

    needs:
      - history-check

    steps:
      - run: |
          echo "Running JOB A"
  jobB:
    name: JOB B

    runs-on: ubuntu-latest

    needs:
      - history-check

    if: needs.history-check.outputs.run_jobB == 'true'

    steps:
      - run: |
          echo "Running JOB B"
  final-job:
    name: FINAL JOB

    runs-on: ubuntu-latest

    needs:
      - history-check
      - jobA
      - jobB

    if: always()

    steps:
      - run: |
          echo "================================="
          echo "JOB A RESULT: ${{ needs.jobA.result }}"
          echo "JOB B RESULT: ${{ needs.jobB.result }}"
          echo "================================="
