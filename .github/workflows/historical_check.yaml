name: Rerun-Recovery-Demo

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:

  history-check:
    name: HISTORY CHECK

    runs-on: ubuntu-latest

    outputs:
      run_jobB: ${{ steps.check.outputs.run_jobB }}

    steps:
      - name: Check previous rerun attempt jobs
        id: check
        run: |

          echo "Checking rerun workflow history..."

          # Default value
          run_jobB=true

          echo "Current Run Attempt: ${{ github.run_attempt }}"

          # FIRST EXECUTION
          if [ "${{ github.run_attempt }}" -eq 1 ]; then

            echo "First workflow execution"

            echo "run_jobB=true" >> $GITHUB_OUTPUT

            exit 0
          fi

          echo "Rerun detected"

          # Previous attempt
          previous_attempt=$((${{ github.run_attempt }} - 1))

          echo "Previous Attempt: $previous_attempt"

          # Fetch jobs from previous attempt of SAME RUN
          jobs=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/$previous_attempt/jobs")

          echo "$jobs"

          jobA_status=$(echo "$jobs" | jq -r \
            '.jobs[] | select(.name=="JOB A") | .conclusion')

          jobB_status=$(echo "$jobs" | jq -r \
            '.jobs[] | select(.name=="JOB B") | .conclusion')

          echo "Previous JOB A Status: $jobA_status"
          echo "Previous JOB B Status: $jobB_status"

          # Skip JOB B if BOTH jobs already succeeded
          if [[ "$jobA_status" == "success" && "$jobB_status" == "success" ]]; then

            echo "JOB A and JOB B already succeeded previously"

            run_jobB=false
          fi

          echo ""
          echo "Final Decision"
          echo "Run JOB B: $run_jobB"

          echo "run_jobB=$run_jobB" >> $GITHUB_OUTPUT

  jobA:
    name: JOB A

    runs-on: ubuntu-latest

    needs: history-check

    # ALWAYS RUN
    steps:
      - run: |
          echo "Running JOB A"

  jobB:
    name: JOB B

    runs-on: ubuntu-latest

    needs:
      - history-check
      - jobA

    # SKIP IF ALREADY SUCCESSFUL IN PREVIOUS ATTEMPT
    if: needs.history-check.outputs.run_jobB == 'true'

    steps:
      - run: |
          echo "Running JOB B"

          # Uncomment for testing
          # exit 1

  final-job:
    name: FINAL JOB

    runs-on: ubuntu-latest

    needs:
      - history-check
      - jobA
      - jobB

    if: always()

    steps:
      - run: |

          echo "================================="
          echo "Run Attempt : ${{ github.run_attempt }}"
          echo "JOB A RESULT : ${{ needs.jobA.result }}"
          echo "JOB B RESULT : ${{ needs.jobB.result }}"
          echo "================================="
