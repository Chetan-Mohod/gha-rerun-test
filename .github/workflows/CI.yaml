name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Application
        run: |
          echo "Building application..."
          echo "Build completed"

      - name: Trigger DEV CD Deployment
        run: |
          gh workflow run CD-job.yaml \
          -f environment="dev" \
          -f image="1.0.${{ github.run_number }}" \
          -f run_post_deployment="false" \
          -f post_deployment_check="true"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
