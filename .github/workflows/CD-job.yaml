name: CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

      image:
        description: 'Build Version'
        required: true
        type: string

      run_post_deployment:
        description: 'Run Post Deployment'
        required: true
        default: true
        type: boolean

      post_deployment_check:
        description: 'Use sqlcmd -b'
        required: true
        default: true
        type: boolean

jobs:

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          echo "Deploying image: ${{ github.event.inputs.image }}"
          echo "Environment: ${{ github.event.inputs.environment }}"

  post-deploy:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event.inputs.run_post_deployment == 'true'
    steps:
      - name: Post Deployment Script
        run: |
          if [ "${{ github.event.inputs.post_deployment_check }}" = "true" ]; then
            echo "Running Post Deployment WITH -b"
          else
            echo "Running Post Deployment WITHOUT -b"
          fi
