name: CD Pipeline

on:

  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

  workflow_dispatch:

    inputs:

      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - qa
          - uat
          - prod

      run_post_deployment:
        description: 'Run Post Deployment'
        required: true
        default: true
        type: boolean

      post_deployment_check:
        description: 'Use -b'
        required: true
        default: true
        type: boolean

jobs:

  deploy-dev:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest

    steps:

      - name: DEV Deploy
        run: echo "Auto Deploying to DEV"

  deploy-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:

      - name: Manual Deploy
        run: |
          echo "Deploying to ${{ github.event.inputs.environment }}"

  post-deploy:
    needs: deploy-manual

    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_post_deployment == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Post Deployment
        run: |

          if [ "${{ github.event.inputs.post_deployment_check }}" = "true" ]; then
            echo "Running WITH -b"
          else
            echo "Running WITHOUT -b"
          fi
